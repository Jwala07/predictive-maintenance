name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check src tests scripts --select E9,F63,F7,F82,F401
      - name: Unit tests (integration tests need PostgreSQL and a trained model)
        run: python -m pytest tests/test_target.py tests/test_features.py tests/test_stream_equals_batch.py -v