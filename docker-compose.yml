services:
  db:
    image: postgres:16
    container_name: pdm_postgres
    environment:
      POSTGRES_USER: pdm_user
      POSTGRES_PASSWORD: pdm_pass
      POSTGRES_DB: pdm_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: pdm_redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
    ports:
      - "9092:9092"
    mem_limit: 1g

volumes:
  pgdata: